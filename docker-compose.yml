version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clizzer-backend
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - WHISPER_MODEL=tiny
      - WHISPER_MODEL_SIZE=tiny
      - DEVICE=cpu
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - TEMP_DIR=temp
      - OUTPUT_DIR=output
      - MODELS_DIR=models_cache
    volumes:
      - ./temp:/app/temp
      - ./output:/app/output
      - ./models_cache:/app/models_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clizzer-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:7860
      - NODE_ENV=production
    depends_on:
      - backend
